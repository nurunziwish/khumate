<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KHUMATE - 경희대학교 제2기숙사 룸메이트 매칭</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-slate-50 min-h-screen pb-24">

  <!-- 상단 사이트 헤더 -->
  <header class="bg-white border-b border-slate-200 sticky top-0 z-20">
    <div class="max-w-xl mx-auto px-4 py-4 flex justify-between items-center">
      <div class="flex items-baseline gap-2 flex-wrap">
        <h1 class="text-2xl font-black tracking-tight bg-gradient-to-r from-red-600 to-orange-500 bg-clip-text text-transparent">KHUMATE</h1>
        <span class="text-xs font-semibold text-slate-500">경희대학교 제2기숙사 룸메이트 매칭</span>
      </div>
      <div class="flex items-center gap-2 shrink-0">
      <!-- 로그인/로그아웃 (auth.js가 상태에 따라 갱신) -->
      <span id="auth-user" class="hidden text-xs font-bold text-slate-600 mr-2"></span>
      <button id="auth-btn" class="text-xs text-white bg-red-600 hover:bg-red-700 font-semibold px-3 py-1 rounded-lg transition">로그인</button>
      </div>
    </div>

    <!-- 탭 네비게이션 -->
    <nav class="max-w-xl mx-auto px-4 flex border-t border-slate-100">
      <button onclick="switchTab('matching')" id="tab-matching" class="flex-1 py-3 text-sm font-bold text-red-600 border-b-2 border-red-600 transition">MATCHING</button>
      <button onclick="switchTab('chatting')" id="tab-chatting" class="flex-1 py-3 text-sm font-semibold text-slate-400 hover:text-slate-600 transition">CHATTING<span id="chat-badge" class="hidden ml-1 align-middle px-1.5 py-0.5 rounded-full bg-red-600 text-white text-[10px] font-bold"></span></button>
      <button onclick="switchTab('houserule')" id="tab-houserule" class="flex-1 py-3 text-sm font-semibold text-slate-400 hover:text-slate-600 transition">HOUSERULE</button>
    </nav>
  </header>

  <!-- 메인 콘텐츠 영역 -->
  <main class="max-w-xl mx-auto px-4 py-6 space-y-6">

    <!-- [탭 1] 매칭 화면 -->
    <div id="content-matching" class="space-y-6">
      <!-- 내 매칭 카드: 후보 목록 머리줄(최신순·관련순)보다 위에 따로 표시 -->
      <div id="my-post-container"></div>

      <div class="flex justify-between items-center gap-2 text-xs font-semibold text-slate-500 px-1">
        <span>매칭 후보 목록</span>
        <div class="flex items-center gap-2">
          <button id="ai-open-btn" onclick="openAiModal()" class="hidden px-2.5 py-1 rounded-lg bg-gradient-to-r from-red-600 to-orange-500 text-white font-bold shadow-sm hover:shadow transition">🤖 AI 정밀 분석</button>
          <button id="sort-latest" onclick="setSort('latest')" class="text-red-600 font-bold">최신순</button>
          <span>·</span>
          <button id="sort-match" onclick="setSort('match')" class="hover:text-slate-800">관련순</button>
        </div>
      </div>

      <!-- 카드 목록 컨테이너 -->
      <div id="card-list-container" class="space-y-3"><p class="text-center text-sm text-slate-400 py-10">불러오는 중...</p></div>
    </div>

    <!-- [탭 2] 채팅 화면 -->
    <div id="content-chatting" class="hidden space-y-3">
      <div class="flex justify-between items-center text-xs font-semibold text-slate-500 px-1">
        <span>메시지함</span>
        <button onclick="renderInbox()" class="hover:text-slate-800">새로고침</button>
      </div>
      <div id="match-requests"></div>
      <div id="inbox-list" class="space-y-2"></div>
    </div>

    <!-- [탭 3] 하우스룰 화면 -->
    <div id="content-houserule" class="hidden">
      <div id="houserule-body" class="py-6"></div>
    </div>

  </main>

  <!-- 하단 고정 내 정보 수정 버튼 -->
  <div class="fixed bottom-6 left-0 right-0 px-4 z-10 pointer-events-none">
    <div class="max-w-xl mx-auto flex justify-end items-center gap-2">
      <button onclick="openFilterModal()" class="pointer-events-auto bg-white hover:bg-slate-50 text-slate-800 font-bold py-3.5 px-6 rounded-full shadow-lg border border-slate-200 transition flex items-center gap-2">
        <span>🔍</span> 필터
      </button>
      <button onclick="openMyCardModal()" class="pointer-events-auto bg-gradient-to-r from-red-600 to-orange-500 hover:shadow-xl text-white font-bold py-3.5 px-6 rounded-full shadow-lg transition flex items-center gap-2">
        <span>⚙️</span> 내 매칭카드
      </button>
    </div>
  </div>

  <!-- [팝업] 쪽지 대화창 (모바일은 아래에서 올라오는 시트) -->
  <div id="thread-modal" class="fixed inset-0 bg-black/50 hidden z-[60] flex justify-center items-end sm:items-center p-0 sm:p-4" onclick="if (event.target === this) closeThread()">
    <div class="bg-white w-full max-w-md h-[80vh] sm:h-[70vh] rounded-t-2xl sm:rounded-2xl shadow-xl flex flex-col overflow-hidden">
      <div class="flex justify-between items-center px-5 py-3 border-b">
        <h3 id="thread-title" class="font-bold text-slate-800 truncate pr-3 flex-1 min-w-0"></h3>
        <button onclick="openViewModal(msgPeer)" class="shrink-0 mr-2 px-3 py-1.5 rounded-lg border border-red-200 bg-white text-red-600 text-xs font-bold hover:bg-red-50 transition">📋 매칭카드</button>
        <button id="thread-match-btn" data-action="send" onclick="onThreadMatchClick()" class="shrink-0 mr-2 px-3 py-1.5 rounded-lg bg-gradient-to-r from-red-600 to-orange-500 text-white text-xs font-bold shadow-sm disabled:bg-none disabled:bg-slate-300 disabled:shadow-none">룸메 매칭 신청</button>
        <button onclick="closeThread()" class="text-slate-400 hover:text-slate-600 font-bold text-lg p-1 shrink-0">✕</button>
      </div>
      <div id="thread-body" class="flex-1 overflow-y-auto px-4 py-3 space-y-3 bg-slate-50"></div>
      <div class="border-t p-3 flex gap-2">
        <input id="thread-input" maxlength="300" placeholder="쪽지 내용 (300자 이하)" class="flex-1 bg-white border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-red-500">
        <button id="thread-send" onclick="sendThreadMessage()" class="px-4 rounded-lg bg-gradient-to-r from-red-600 to-orange-500 text-white font-bold text-sm shadow-sm">보내기</button>
      </div>
    </div>
  </div>

  <!-- [팝업 1] 필터 모달 -->
  <div id="filter-modal" class="fixed inset-0 bg-black/50 hidden z-50 flex justify-center items-center p-4">
    <div class="bg-white w-full max-w-md p-6 rounded-2xl shadow-xl space-y-4">
      <div class="flex justify-between items-center border-b pb-3">
        <h3 class="font-bold text-lg text-slate-800">조건 필터 설정</h3>
        <button onclick="closeFilterModal()" class="text-slate-400 hover:text-slate-600 font-bold">✕</button>
      </div>
      <p class="text-sm text-slate-500">상세 필터 옵션 설정 공간입니다.</p>
      <button onclick="closeFilterModal()" class="w-full py-2.5 bg-slate-900 text-white font-bold rounded-lg">적용하기</button>
    </div>
  </div>

  <!-- [팝업 2] 내 정보 수정 모달 (상하단 고정형 레이아웃) -->
  <div id="profile-modal" class="fixed inset-0 bg-black/50 hidden z-50 flex justify-center items-center p-4">
    <div class="bg-white w-full max-w-lg rounded-2xl shadow-xl flex flex-col max-h-[85vh] overflow-hidden">
      
      <!-- [상단 고정] 모달 헤더 -->
      <div class="flex justify-between items-center border-b px-6 py-4 bg-white sticky top-0 z-20">
        <div>
          <span class="text-xs font-bold text-red-600 uppercase tracking-wide">Profile Settings</span>
          <h3 class="font-bold text-xl text-slate-800">내 정보 수정하기</h3>
        </div>
        <button onclick="closeProfileEdit()" class="text-slate-400 hover:text-slate-600 font-bold text-lg p-1">✕</button>
      </div>

      <!-- [중간 스크롤 영역] 설문 폼 내용 -->
      <div id="profile-scroll" class="p-6 space-y-6 overflow-y-auto flex-1">

        <!-- 최상단 독자적 배치: 게시글 제목 -->
        <div class="bg-red-50/50 p-4 rounded-xl border border-red-200">
          <label class="block text-xs font-bold text-red-600 mb-1.5">게시글 제목</label>
          <input type="text" id="post-title" value="룸메이트 구해요" placeholder="예: 룸메이트 구해요" class="w-full bg-white border border-slate-300 rounded-lg px-3 py-2.5 text-sm font-bold text-slate-800 focus:outline-none focus:ring-2 focus:ring-red-500 shadow-sm">
        </div>

        <!-- 탭: 나의 성향 / 원하는 룸메 (버튼은 profile-form.js 가 PROFILE_TABS 로 만듦) -->
        <div id="profile-tabs" data-tab-bar data-target="profile-sections" class="grid grid-cols-2 gap-2 sticky top-0 z-10 bg-white py-1"></div>

        <!-- 카테고리: profile-schema.js 정의에 따라 profile-form.js가 탭별로 자동 생성 (data-tabs = 탭 사용) -->
        <div id="profile-sections" data-tabs="1" class="space-y-6"></div>

      </div>

      <!-- [하단 고정] 저장 및 게시 버튼 -->
      <div class="border-t px-6 py-4 bg-white sticky bottom-0 z-20 flex gap-2">
        <div class="flex-1 min-w-0">
          <button onclick="saveDraft()" class="w-full py-3 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold rounded-xl shadow-sm transition">
            보관하기
          </button>
        </div>
        <button onclick="confirmPublish()" class="flex-1 py-3 bg-gradient-to-r from-red-600 to-orange-500 hover:shadow-lg text-white font-bold rounded-xl shadow-sm transition">
          게시하기
        </button>
      </div>

    </div>
  </div>

  <!-- [팝업] 로그인 / 회원가입 모달 (아이디 + 비밀번호) -->
  <div id="auth-modal" class="fixed inset-0 bg-black/50 hidden z-50 flex justify-center items-center p-4">
    <div class="bg-white w-full max-w-sm rounded-2xl shadow-xl p-6">
      <div class="flex justify-between items-center mb-4">
        <h3 class="font-bold text-lg text-slate-800">KHUMATE 계정</h3>
        <button onclick="closeAuthModal()" class="text-slate-400 hover:text-slate-600 text-xl leading-none">&times;</button>
      </div>

      <div id="auth-tabs" class="flex mb-5 border-b border-slate-200">
        <button id="auth-tab-login" onclick="showAuthView('login')" class="flex-1 pb-2 text-sm font-bold border-b-2">로그인</button>
        <button id="auth-tab-signup" onclick="showAuthView('signup')" class="flex-1 pb-2 text-sm font-bold border-b-2">회원가입</button>
      </div>

      <!-- 로그인 -->
      <div id="auth-view-login" class="space-y-4">
        <div>
          <label class="block text-sm font-bold text-slate-700 mb-2 ">아이디</label>
          <input id="login-id" type="text" placeholder="아이디" autocomplete="username" autocapitalize="none" spellcheck="false" class="w-full bg-white border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-red-500">
        </div>
        <div>
          <label class="block text-sm font-bold text-slate-700 mb-2 ">비밀번호</label>
          <input id="login-pw" type="password" placeholder="비밀번호" autocomplete="current-password" class="w-full bg-white border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-red-500">
        </div>
        <button id="auth-login-btn" onclick="login()" class="w-full mt-5 bg-red-600 hover:bg-red-700 text-white font-bold py-2.5 rounded-lg text-sm transition disabled:opacity-50">로그인</button>
      </div>

      <!-- 회원가입 (인증 없이 바로 가입) -->
      <div id="auth-view-signup" class="space-y-4 hidden">
        <div>
          <label class="block text-sm font-bold text-slate-700 mb-2 ">아이디</label>
          <input id="signup-id" type="text" placeholder="영문 소문자·숫자·_ 4~20자" autocomplete="username" autocapitalize="none" spellcheck="false" maxlength="20" class="w-full bg-white border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-red-500">
        </div>
        <div>
          <label class="block text-sm font-bold text-slate-700 mb-2 ">비밀번호 (8자 이상)</label>
          <input id="signup-pw" type="password" placeholder="비밀번호" autocomplete="new-password" class="w-full bg-white border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-red-500">
        </div>
        <div>
          <label class="block text-sm font-bold text-slate-700 mb-2 ">비밀번호 확인</label>
          <input id="signup-pw2" type="password" placeholder="비밀번호 다시 입력" autocomplete="new-password" class="w-full bg-white border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-red-500">
        </div>
        <p class="text-[11px] text-slate-400">메일 인증 없이 바로 가입돼요. 비밀번호를 잊으면 찾을 수 없으니 꼭 기억해 주세요.</p>
        <button id="auth-signup-btn" onclick="signUp()" class="w-full mt-2 bg-red-600 hover:bg-red-700 text-white font-bold py-2.5 rounded-lg text-sm transition disabled:opacity-50">가입하기</button>
      </div>

      <p id="auth-msg" class="text-xs mt-3"></p>
    </div>
  </div>

  <!-- [팝업] 다른 사람 글 보기 (읽기 전용, 내 정보 수정 폼과 같은 모양) -->
  <!-- AI 정밀 분석 팝업 (script.js 의 openAiModal) -->
  <div id="ai-modal" class="fixed inset-0 bg-black/50 hidden z-50 flex justify-center items-center p-4" onclick="if (event.target === this) closeAiModal()">
    <div class="bg-slate-50 w-full max-w-lg rounded-2xl shadow-xl flex flex-col max-h-[88vh] overflow-hidden">
      <div class="relative bg-gradient-to-br from-red-600 via-rose-500 to-orange-400 text-white px-6 py-5">
        <button onclick="closeAiModal()" class="absolute top-3 right-4 text-white/80 hover:text-white font-bold text-lg p-1">✕</button>
        <span class="text-[11px] font-black tracking-widest uppercase opacity-80">AI Precision Match</span>
        <h3 class="font-black text-xl mt-0.5">🤖 AI 정밀 분석</h3>
        <p id="ai-modal-info" class="text-xs opacity-90 mt-1"></p>
      </div>
      <div class="px-5 py-3 bg-white border-b flex justify-end">
        <button id="ai-run-btn" onclick="runAiMatch()" class="px-4 py-2 bg-red-600 hover:bg-red-700 text-white text-xs font-bold rounded-lg shadow-sm transition disabled:bg-slate-300"></button>
      </div>
      <div id="ai-modal-body" class="p-5 space-y-3 overflow-y-auto flex-1"></div>
    </div>
  </div>

  <div id="view-modal" class="fixed inset-0 bg-black/50 hidden z-[70] flex justify-center items-center p-4" onclick="if (event.target === this) closeViewModal()">
    <div class="bg-white w-full max-w-lg rounded-2xl shadow-xl flex flex-col max-h-[85vh] overflow-hidden">
      <div class="flex justify-between items-center border-b px-6 py-4 bg-white sticky top-0 z-20 gap-3">
        <div class="min-w-0">
          <span class="text-xs font-bold text-red-600 uppercase tracking-wide">Roommate Post</span>
          <h3 id="view-title" class="font-bold text-xl text-slate-800 break-words"></h3>
        </div>
        <div class="flex items-center gap-2 shrink-0">
          <div class="flex items-center gap-2 shrink-0">
            <button id="view-msg-btn" onclick="onNoteClick()" class="px-3 py-1.5 bg-gradient-to-r from-red-600 to-orange-500 hover:shadow text-white text-xs font-bold rounded-lg shadow-sm transition disabled:bg-none disabled:bg-slate-300 disabled:cursor-not-allowed">💬 쪽지</button>
            <button onclick="closeViewModal()" class="text-slate-400 hover:text-slate-600 font-bold text-lg p-1">✕</button>
          </div>
        </div>
      </div>

      <div id="view-scroll" class="p-6 space-y-6 overflow-y-auto flex-1">
        <p id="view-meta" class="hidden text-xs font-semibold text-slate-500"></p>
        <div id="view-ai" class="hidden"></div>
        <div id="view-compare" class="hidden"></div>
        <!-- 읽기 전용: 입력칸은 비활성화되어 있고 클릭이 막혀 있음 (script.js 의 openViewModal) -->
        <div data-tab-bar data-target="view-sections" class="grid grid-cols-2 gap-2 sticky top-0 z-10 bg-white py-1"></div>
        <div id="view-sections" data-tabs="1" class="space-y-6 pointer-events-none select-none"></div>
      </div>

      <!-- 내 매칭 카드일 때만 보임 (openViewModal 에서 채움). 닫기는 위 ✕ -->
      <div id="view-footer" class="hidden border-t px-6 py-4 bg-white sticky bottom-0 z-20"></div>
    </div>
  </div>

  <!-- [커스텀 알림/확인 모달 팝업] -->
  <div id="confirm-modal" class="fixed inset-0 bg-black/50 hidden z-50 flex justify-center items-center p-4">
    <div class="bg-white w-full max-w-sm p-6 rounded-2xl shadow-xl space-y-4 text-center">
      <div class="w-12 h-12 bg-red-100 text-red-600 rounded-full flex items-center justify-center mx-auto font-bold text-xl">!</div>
      <h3 class="font-bold text-lg text-slate-800">게시글 작성 확인</h3>
      <p class="text-xs text-slate-600 leading-relaxed">
        정말 게시하시겠습니까?<br>
        <span class="text-red-600 font-bold">기존에 업로드된 글은 삭제</span>되고 새 글이 작성됩니다.
      </p>
      <div class="flex gap-2 pt-2">
        <button onclick="closeConfirmModal()" class="flex-1 py-2.5 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold text-sm rounded-xl transition">취소</button>
        <button onclick="executePublish()" class="flex-1 py-2.5 bg-gradient-to-r from-red-600 to-orange-500 hover:shadow-lg text-white font-bold text-sm rounded-xl transition">게시하기</button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/supabase-config.js"></script>
  <script src="auth.js" defer></script>
  <script src="posts.js" defer></script>
  <script src="profile-schema.js" defer></script>
  <script src="profile-form.js" defer></script>
  <script src="matching.js" defer></script>
  <script src="messages.js" defer></script>
  <script src="matches.js" defer></script>
  <script src="script.js" defer></script>
</body>
</html>
